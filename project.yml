name: Girasol
options:
  bundleIdPrefix: com.kisnner26
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    watchOS: "10.0"
packages:
  SunKit:
    path: .
targets:
  Girasol:
    type: application
    platform: watchOS
    sources:
      - Girasol
      - Shared
    dependencies:
      - target: GirasolWidgets
      - package: SunKit
      - package: SunKit
        product: HealthCore
      - package: SunKit
        product: GameCore
      - package: SunKit
        product: Localization
    entitlements:
      path: Girasol/Girasol.entitlements
      properties:
        com.apple.developer.healthkit: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kisnner26.shared
    info:
      path: Girasol/Info.plist
      properties:
        CFBundleDisplayName: Girasol
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        WKBackgroundModes:
          - mindfulness
        NSLocationDefaultAccuracyReduced: true
        NSMotionUsageDescription: "girasol uses watch motion to recognize game gestures and calibrate aiming."
        NSHealthShareUsageDescription: "girasol reads water, calories, activity, daylight, heart rate, oxygen, sleep, weight, height, age and sex from Health to display records and suggest goals."
        NSHealthUpdateUsageDescription: "girasol saves the water, calories and breathing minutes you log to Health."
        NSLocationWhenInUseUsageDescription: "girasol sends approximate coordinates to open-meteo for uv and weather, and uses your location to orient the shade compass."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kisnner26.girasol
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  GirasolWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - GirasolWidgets
      - Shared
    entitlements:
      path: GirasolWidgets/GirasolWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kisnner26.shared
    info:
      path: GirasolWidgets/Info.plist
      properties:
        CFBundleDisplayName: Girasol
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kisnner26.girasol.widgets
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
schemes:
  Girasol:
    build:
      targets:
        Girasol: all
    run:
      config: Debug
